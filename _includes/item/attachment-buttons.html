{% assign post = include.post %}

<div class="item-buttons">
  {% for attachment in post.attachments %}
    {% include item/attachment-button.html attachment=attachment %}
  {% endfor %}

  {% if include.link_page %}
    <a href="{{ post.url }}" class="btn btn-outline-secondary">See More <i class="fa-solid fa-caret-right"></i></a>
  {% endif %}
</div>
