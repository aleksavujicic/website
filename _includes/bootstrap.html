<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

<!-- Enable Popovers -->
<script type="text/javascript">
const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl));
const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));


const copyButtons = document.querySelectorAll('.code-block .code-buttons .code-button.code-copy');
[...copyButtons].map(button => {
  codebox = button.parentElement.parentElement.querySelector("pre code");
  confirm = button.parentElement.querySelector(".code-copy-confirm");
  button.addEventListener("click", () => copyCode(button, codebox, confirm));
});

function copyCode(button, codebox, confirm) {
  text = codebox.innerText;
  navigator.clipboard.writeText(text).then(
    () => {
      /* clipboard successfully set */
      button.classList.add("d-none");
      confirm.classList.remove("d-none");
      bootstrap.Tooltip.getInstance(button).hide();
      setTimeout(() => {
        button.classList.remove("d-none");
        confirm.classList.add("d-none");
      }, 2500);
    },
    () => {
      /* clipboard write failed */
    },
  );
}
</script>
